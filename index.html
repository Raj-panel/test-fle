<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Boost Panel</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Platform Selector Header -->
    <header class="platform-header">
        <button id="btnInsta" onclick="switchPlatform('instagram')" class="active">
            <i class="fa-brands fa-instagram"></i> Instagram
        </button>
        <button id="btnFb" onclick="switchPlatform('facebook')">
            <i class="fa-brands fa-facebook"></i> Facebook
        </button>
        <button id="btnYt" onclick="switchPlatform('youtube')">
            <i class="fa-brands fa-youtube"></i> YouTube
        </button>
        <button id="btnTt" onclick="switchPlatform('tiktok')">
            <i class="fa-brands fa-tiktok"></i> TikTok
        </button>
    </header>

    <!-- Main Container -->
    <main class="main-container">

        <!-- Dynamic Hero Banner -->
        <div class="hero-banner" id="heroBanner">
            <div class="hero-icon" id="heroLogoIcon">
                <i class="fa-brands fa-instagram"></i>
            </div>
            <h2 id="heroTitle" class="hero-title">Instagram Boost</h2>
            <p>Select your category and package to boost your reach today!</p>
        </div>

        <!-- Category Scroll Tabs -->
        <div class="category-tabs" id="categoryTabs">
            <!-- Tabs injected dynamically via JS -->
        </div>

        <!-- Package List Container -->
        <div class="package-list" id="packageList">
            <!-- Packages injected dynamically via JS -->
        </div>

        <!-- App Install Container (PWA Prompt) -->
        <div id="installContainer" style="display: none;">
            <button id="installBtn" class="install-btn">
                📲 Install App for Faster Access
            </button>
        </div>

    </main>

    <!-- Checkout Modal Included -->
    <!-- (Include your checkout modal elements here if single page app, or link checkout.html) -->

    <script src="script.js"></script>
</body>
</html>
